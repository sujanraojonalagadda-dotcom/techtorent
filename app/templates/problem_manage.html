{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Problem Management</h2>
  <a href="{{ url_for('add_problem') }}">Add Problem</a>
  <table>
    <tr><th>ID</th><th>Title</th><th>Time Limit</th><th>Actions</th></tr>
    {% for p in problems %}
    <tr>
      <td>{{ p.id }}</td><td>{{ p.title }}</td><td>{{ p.time_limit }}</td>
      <td>
        <a href="{{ url_for('edit_problem', problem_id=p.id) }}">Edit</a>
        <form method="post" action="{{ url_for('delete_problem', problem_id=p.id) }}" style="display:inline;"><button>Delete</button></form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
